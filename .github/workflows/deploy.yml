name: Build & Deploy API

on:
  push:
    branches: [main]
  # Tests only — see the `if` on build and deploy. A pull request gets the
  # same gate `main` does, before the merge rather than after it.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Deploys queue behind each other; a pull request's test run gets its own
  # group so it never waits for (or holds up) a deploy.
  group: deploy-api-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ibrohimfayzullayev/portfolio-api
  # Must match the sqlc you run locally (`sqlc version`): two versions can
  # format generated code differently, and the drift check below would then
  # fail for a reason that has nothing to do with the change being pushed.
  SQLC_VERSION: "1.31.1"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # The one failure this pipeline has actually had: a migration changed the
      # schema, internal/db was regenerated locally but never committed, and
      # the build fell over with six confusing "undefined field" errors. This
      # step turns that into one obvious message, before anything else runs.
      - name: sqlc code is up to date
        run: |
          curl -sSL "https://downloads.sqlc.dev/sqlc_${SQLC_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin sqlc
          sqlc generate
          if ! git diff --exit-code --stat internal/db; then
            echo "::error::internal/db is stale. Run 'make generate' and commit internal/db."
            exit 1
          fi

      - run: go vet ./...

      # Integration tests skip themselves without this; with the service above
      # they run for real against a throwaway database.
      # -p 1: the API's, the ops bot's and the finance bot's integration
      # tests share this one PostgreSQL; run side by side they clean each
      # other's tables and fail at random.
      - run: go test ./... -count=1 -p 1
        env:
          TEST_DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio_test?sslmode=disable

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # Lets this job's own token pull the image it is about to deploy.
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          envs: GHCR_USER,GHCR_TOKEN
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/portfolio

            # Domains come from .env; source it FIRST so its TAG=latest cannot
            # clobber the pinned tag below.
            set -a; . ./.env; set +a

            # The image tag is pinned to this commit rather than `latest`, so a
            # rollback is `TAG=<previous sha> docker compose up -d api`.
            export TAG="${{ github.sha }}"
            # Every service that ships from this image: the ops bot and the
            # finance bot are binaries in it with their own entrypoints.
            # Updating only the API would leave the bots running whatever they
            # were started with, which looks exactly like a successful deploy.
            # Pull with a token minted for this run, kept in a throwaway docker
            # config. The server used to rely on a personal access token from a
            # one-off `docker login`; when that expired, every deploy failed with
            # "denied" while the old container kept answering. This token cannot
            # go stale between deploys because it never outlives one, and the
            # temporary config means it does not overwrite the server's own login.
            img="$REGISTRY/portfolio-api:$TAG"
            auth=$(mktemp -d)
            trap 'rm -rf "$auth"' EXIT
            echo "$GHCR_TOKEN" | docker --config "$auth" login ghcr.io -u "$GHCR_USER" --password-stdin
            if ! docker --config "$auth" pull "$img"; then
              echo "pull with the run token failed; trying the server's stored login"
              if ! docker pull "$img"; then
                echo "FAILED: cannot pull $img (registry access)"
                exit 1
              fi
            fi
            # --no-deps for the same reason the other two repos need it: TAG
            # applies to every service in the file, so a dependency must never
            # be resolved at this deploy's tag. db is a fixed image and is
            # already running.
            # finbot only once the server's compose file has it: that file is
            # copied by hand (runbook), and naming a service it does not know
            # would fail the whole deploy, API included.
            svcs="api bot"
            if docker compose -f docker-compose.prod.yml --env-file .env config --services | grep -qx finbot; then
              svcs="$svcs finbot"
            fi
            docker compose -f docker-compose.prod.yml --env-file .env up -d --no-deps $svcs

            # A 200 from the site proves SOMETHING is answering, not that it is
            # the new build — the previous container answers 200 just as well.
            # Compare the running container's image id with the one we just
            # pulled, so a deploy that quietly kept the old image fails here
            # instead of being reported green.
            want=$(docker image inspect "$REGISTRY/portfolio-api:$TAG" --format '{{.Id}}')
            for svc in $svcs; do
              got=$(docker inspect "$(docker compose -f docker-compose.prod.yml ps -q $svc)" --format '{{.Image}}')
              if [ "$want" != "$got" ]; then
                echo "FAILED: $svc is still running $got, expected $want"
                docker compose -f docker-compose.prod.yml ps $svc
                exit 1
              fi
              echo "image ok: $svc -> $TAG"
            done

            for i in $(seq 1 20); do
              if curl -fsS "https://$API_DOMAIN/healthz" >/dev/null; then
                echo "healthy: $API_DOMAIN/healthz"
                echo "$TAG $(date -Is)" >> deployed-api.log

                # Tell the ops bot. `|| true` because a deploy that worked must
                # not be reported as failed just because the notification did
                # not land (e.g. before migration 000004 has run).
                docker compose -f docker-compose.prod.yml exec -T db \
                  psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -q -c \
                  "INSERT INTO notifications (kind, payload) VALUES ('deploy.finished', jsonb_build_object('service', 'api', 'sha', '$TAG'));" \
                  >/dev/null 2>&1 || true

                docker image prune -f
                exit 0
              fi
              sleep 3
            done
            echo "FAILED: $API_DOMAIN/healthz did not become healthy within 60s"
            docker compose -f docker-compose.prod.yml logs --tail 50 api
            exit 1
