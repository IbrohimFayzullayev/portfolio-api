# Production stack for a single VPS.
#
#   db        — PostgreSQL 16 (internal only, data on a named volume)
#   api       — Go API (image built in CI, pushed to ghcr.io)
#   web       — public Next.js site
#   dashboard — admin Next.js CMS
#   caddy     — reverse proxy + automatic HTTPS (Let's Encrypt)
#   umami     — self-hosted web analytics (own database on the same Postgres)
#   finbot    — the stand-alone finance bot + its Mini App API (own database)
#
# Variable values come from the sibling `.env` file (see .env.prod.example).
# Deploy from /opt/portfolio on the server:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d

name: portfolio

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    image: ${REGISTRY}/portfolio-api:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # The Telegram Mini App signs in with init data signed by the bot's
      # token, and only these ids get in — the same two values as the bot.
      # Without them POST /tg/auth answers 404 and nothing else changes.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID}
      # The dashboard's "Moliya boti" pages: the API forwards them to the
      # finance bot with this key. Empty = those pages answer 404.
      FINBOT_INTERNAL_URL: http://finbot:8090
      FINBOT_ADMIN_KEY: ${FINBOT_ADMIN_KEY:-}
    networks: [internal]

  # Operations bot. Same image as `api`, different entrypoint — running it as
  # its own container is the point: a monitor that lives inside the thing it
  # monitors goes quiet exactly when you need it.
  bot:
    image: ${REGISTRY}/portfolio-api:${TAG:-latest}
    entrypoint: ["/app/bot"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID}
      INTERNAL_API_URL: http://api:8080
      PUBLIC_SITE_URL: https://${PUBLIC_DOMAIN}
      ADMIN_SITE_URL: https://${DASHBOARD_DOMAIN}
      PUBLIC_API_URL: https://${API_DOMAIN}
      # Umami runs beside us on the internal network, so the bot talks to the
      # container directly rather than back out through Caddy and TLS.
      UMAMI_URL: http://umami:3000
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_USERNAME: ${UMAMI_USERNAME:-}
      UMAMI_PASSWORD: ${UMAMI_PASSWORD:-}
      UMAMI_API_KEY: ${UMAMI_API_KEY:-}
      # Optional. A check URL from an external uptime service (healthchecks.io
      # or similar); the bot GETs it every two minutes. The only alert that
      # still fires when this whole server is gone. See deploy/cron/README.md.
      HEARTBEAT_PING_URL: ${HEARTBEAT_PING_URL:-}
    networks: [internal]

  # The finance bot: a separate Telegram bot for other people's money logs.
  # Same image, its own entrypoint, its own token and its OWN database
  # (`finbot`, created by the bot itself on first start) - it never touches
  # the portfolio database, and nothing in the portfolio stack reads its one.
  # Without FINBOT_TOKEN it idles and does nothing.
  finbot:
    image: ${REGISTRY}/portfolio-api:${TAG:-latest}
    entrypoint: ["/app/finbot"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FINBOT_TOKEN: ${FINBOT_TOKEN:-}
      FINBOT_ADMIN_ID: ${FINBOT_ADMIN_ID:-}
      FINBOT_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${FINBOT_DB:-finbot}?sslmode=disable
      FINBOT_WEBAPP_URL: https://${FINBOT_DOMAIN:-hisob.fayzullayev.uz}/pul
      FINBOT_HTTP_ADDR: ":8090"
      # Same key as the api service; see there.
      FINBOT_ADMIN_KEY: ${FINBOT_ADMIN_KEY:-}
      # false = the admin sees who uses the bot, never amounts. Users are
      # told which of the two it is.
      FINBOT_ADMIN_SEES_MONEY: ${FINBOT_ADMIN_SEES_MONEY:-true}
    networks: [internal]

  web:
    image: ${REGISTRY}/portfolio:${TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    networks: [internal]

  dashboard:
    image: ${REGISTRY}/portfolio-dashboard:${TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    networks: [internal]

  # Self-hosted analytics. Shares the Postgres container but uses its own
  # database (UMAMI_DB), so a dump of `portfolio` stays free of pageview data.
  # The `umami` database is NOT created by the Postgres entrypoint on an
  # existing volume — create it once by hand:
  #   docker compose -f docker-compose.prod.yml exec -T db \
  #     psql -U $POSTGRES_USER -c "CREATE DATABASE umami OWNER $POSTGRES_USER;"
  umami:
    # Upstream's own compose uses :latest. Pin to the digest you actually ran
    # (docker image inspect ... --format '{{index .RepoDigests 0}}') once it is
    # up, so a surprise major version cannot arrive with the next `pull`.
    image: ghcr.io/umami-software/umami:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${UMAMI_DATABASE_URL}
      APP_SECRET: ${UMAMI_APP_SECRET}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_2FA_KEY}
      # Umami phones home for release notes otherwise.
      DISABLE_TELEMETRY: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # finbot is deliberately NOT here. Caddy is the one door to every site;
    # if it waits on a service that cannot start, everything goes dark with
    # it. A missing upstream should be a 502 on its own domain, nothing more.
    depends_on: [web, dashboard, api, umami]
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      # Defaults here, not only in the Caddyfile: compose passes an unset
      # variable as an EMPTY one, and Caddy's {$VAR:default} applies only to
      # a variable that is missing altogether. An empty address breaks the
      # whole Caddyfile (see the comment on the Umami block there).
      STATS_DOMAIN: ${STATS_DOMAIN:-stats.fayzullayev.uz}
      FINBOT_DOMAIN: ${FINBOT_DOMAIN:-hisob.fayzullayev.uz}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Other projects' site blocks (see the end of the Caddyfile).
      - ./caddy-sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
